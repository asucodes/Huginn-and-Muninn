[project]
name = "taknee"
version = "0.1.0"
description = "Huginn & Muninn kernel: agentic coding system for small open-weight models (<=80B total params)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "litellm>=1.60",  # OSS transport: unified OpenAI-compatible calls (MIT)
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
taknee = "taknee.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taknee"]

[tool.hatch.build.targets.wheel.force-include]
"src/taknee/console.html" = "taknee/console.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
